events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=30s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 2G;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name _;

        set $nextjs_upstream nextjs:3000;
        set $directus_upstream directus:8055;
        set $onlyoffice_upstream onlyoffice:80;

        # Course resource files
        location /resources/ {
            alias /data/resources/;
            autoindex off;
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin "*";
        }

        # Avatar animations (Lottie JSON files)
        location /avatars/ {
            alias /data/avatars/;
            autoindex off;
            add_header Cache-Control "public, max-age=86400";
            add_header Access-Control-Allow-Origin "*";
        }

        # Mini-app static bundles
        location /miniapps/ {
            root /data;
            autoindex off;
            sendfile off;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin "*";
        }

        # Next.js Admin Dashboard - single location
        location /manage {
            proxy_pass http://$nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Legacy /admin route now redirects to the unified in-app content console
        location = /admin {
            return 302 /manage/content;
        }

        location /admin/ {
            return 302 /manage/content;
        }

        # Directus public asset proxy
        location ^~ /directus/assets/ {
            limit_except GET HEAD {
                deny all;
            }

            proxy_pass http://$directus_upstream/assets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Directus public read-only data proxy for front-end content collections only
        location ~ ^/directus/items/(units|lessons|lesson_modules|module_items|resources)(/.*)?$ {
            limit_except GET HEAD {
                deny all;
            }

            rewrite ^/directus/(.*)$ /$1 break;
            proxy_pass http://$directus_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /directus/items/ {
            return 404;
        }

        # Do not expose other Directus surfaces to browsers
        location /directus/ {
            return 404;
        }

        # ONLYOFFICE document server root-level absolute assets/endpoints.
        # The editor can emit root-path requests even when mounted under a subpath.
        location ~ ^/[0-9]+\.[0-9]+\.[0-9]+-[^/]+/ {
            proxy_pass http://$onlyoffice_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host/onlyoffice;
            proxy_set_header X-Forwarded-Prefix /onlyoffice;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ ^/(cache|web-apps|sdkjs|fonts|dictionaries|doc|downloadas|coauthoring|spellchecker|hosting)(/|$) {
            proxy_pass http://$onlyoffice_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host/onlyoffice;
            proxy_set_header X-Forwarded-Prefix /onlyoffice;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ONLYOFFICE can occasionally duplicate the mount prefix in generated URLs.
        location ^~ /onlyoffice/onlyoffice/ {
            rewrite ^/onlyoffice/onlyoffice/(.*)$ /$1 break;
            proxy_pass http://$onlyoffice_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host/onlyoffice;
            proxy_set_header X-Forwarded-Prefix /onlyoffice;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ONLYOFFICE document server subpath mount.
        location ^~ /onlyoffice/ {
            rewrite ^/onlyoffice/(.*)$ /$1 break;
            proxy_pass http://$onlyoffice_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host/onlyoffice;
            proxy_set_header X-Forwarded-Prefix /onlyoffice;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Next.js proxy
        location / {
            proxy_pass http://$nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
